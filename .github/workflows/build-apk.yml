name: APK bauen

on:
  push:
    branches: [ main, claude/apkn-erstellen-bo8j2t ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: JDK 17 einrichten
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK Pakete installieren
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk

      - name: Gradle Wrapper erzeugen
        run: gradle wrapper --gradle-version 8.7

      - name: Debug APK bauen
        run: ./gradlew assembleDebug --no-daemon

      - name: APK als Download bereitstellen
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: MiniGamesHub-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
