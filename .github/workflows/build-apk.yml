name: APK bauen

on:
  push:
    branches: [ main, claude/apkn-erstellen-bo8j2t ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: JDK 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v3

      - name: Gradle Wrapper erzeugen
        run: gradle wrapper --gradle-version 8.7

      - name: Debug APK bauen
        run: ./gradlew assembleDebug --no-daemon

      - name: APK als Download bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: MiniGamesHub-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
