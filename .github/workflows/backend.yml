name: Backend bauen und testen

on:
  push:
    branches: [ main, claude/apkn-erstellen-bo8j2t ]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  workflow_dispatch:

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Code auschecken
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Python 3.12 einrichten
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Abhaengigkeiten installieren
        run: pip install -r requirements.txt

      - name: Python Syntax pruefen
        run: python -m compileall app

      - name: Docker Image bauen
        run: docker build -t social-feed-backend:ci .

      - name: Container starten und Health Check pruefen
        run: |
          docker run -d --name social-feed-backend -p 8000:8000 social-feed-backend:ci
          for i in $(seq 1 20); do
            if curl -sSf http://localhost:8000/health >/dev/null; then
              echo "Backend ist erreichbar."
              break
            fi
            if [ "$i" -eq 20 ]; then
              echo "Backend antwortet nicht, Container-Logs:"
              docker logs social-feed-backend
              exit 1
            fi
            sleep 1
          done
          curl -sSf http://localhost:8000/health
          echo
          curl -sSf http://localhost:8000/users | head -c 500
          echo
          curl -sSf http://localhost:8000/openapi.json >/dev/null
          echo "OpenAPI Schema erreichbar."

      - name: Container stoppen
        if: always()
        run: docker rm -f social-feed-backend || true
